<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מתמטיקה | שי לי ברכה</title><style>body{font-family:Arial;margin:0;background:#fff8fc;color:#24324a}header{background:white;padding:18px 7%;box-shadow:0 2px 12px #0001}a{margin:0 10px;text-decoration:none;color:#7657e8;font-weight:bold}.box{max-width:800px;margin:50px auto;padding:35px;background:white;border-radius:25px;box-shadow:0 12px 35px #0001}h1{text-align:center;color:#7657e8}.q{background:#f8faff;padding:18px;border-radius:15px;margin:15px 0}.q input{width:100%;padding:11px;box-sizing:border-box;border:2px solid #dbe2ef;border-radius:10px}.check{margin-top:9px;padding:10px 18px;border:0;border-radius:10px;background:#7657e8;color:white;font-weight:bold}.r{font-weight:bold;margin-top:8px}</style></head><body><header><a href="index.html">🏠 ראשי</a><a href="english.html">🇬🇧 אנגלית</a><a href="math.html">🧮 מתמטיקה</a></header><main class="box"><h1>🧮 מתמטיקה</h1><p><strong>שאלות חשיבה לכיתה ה׳</strong></p><div class="q"><p>1. ליאור קנה 3 מחברות ב־8 ₪ כל אחת ועט ב־5 ₪. כמה כסף שילם בסך הכול?</p><input id="m1"><button class="check" onclick="check('m1','29','r1')">בדיקה</button><div id="r1" class="r"></div></div><div class="q"><p>2. השלימו: 4, 8, 16, 32, __</p><input id="m2"><button class="check" onclick="check('m2','64','r2')">בדיקה</button><div id="r2" class="r"></div></div><div class="q"><p>3. במלבן יש 6 שורות ובכל שורה 9 ריבועים. כמה ריבועים יש?</p><input id="m3"><button class="check" onclick="check('m3','54','r3')">בדיקה</button><div id="r3" class="r"></div></div><div class="q"><p>4. לדנה יש 50 מדבקות. היא נתנה 17 וקיבלה עוד 12. כמה יש לה עכשיו?</p><input id="m4"><button class="check" onclick="check('m4','45','r4')">בדיקה</button><div id="r4" class="r"></div></div></main><script>function check(i,a,r){let v=document.getElementById(i).value.trim(),e=document.getElementById(r);e.textContent=v===a?'🎉 נכון! כל הכבוד!':'כמעט! נסו שוב 😊';e.style.color=v===a?'#159957':'#d13b59'}</script></body></html>
